# Cloudflare Worker 配置文件
# 更多配置选项: https://developers.cloudflare.com/workers/wrangler/configuration/

# Worker 名称(修改为你想要的名称)
name = "cloudflare-search"

# Worker 主文件
main = "worker.js"

# 兼容日期 - 锁定 Workers 运行时行为
# 使用你开发时的日期,避免未来行为变更影响你的代码
compatibility_date = "2024-12-04"

# 自动使用 workers.dev 子域名
# 设置为 true 会自动分配一个 xxx.workers.dev 域名
workers_dev = true

# 账号 ID (可选,部署时会自动填充)
# account_id = "your-account-id"

# ============================================
# 路由配置(可选)
# ============================================
# s.piaode.ren 已通过 Dashboard 绑定到 cloudflare-search-solo worker，无需在此配置。
# 若要改用 wrangler 管理自定义域名，取消注释并改为你自己的 zone：
# routes = [
#   { pattern = "s.piaode.ren", custom_domain = true, zone_name = "piaode.ren" }
# ]

# ============================================
# 环境变量(可选)
# ============================================
[vars]
# Fail closed for public deployments. Set TOKEN with:
#   wrangler secret put TOKEN
# 注意：solo 应用侧 /search 默认不带 token；此处默认关闭鉴权。若需开启，改回 "true" 并设置 TOKEN secret。
AUTH_REQUIRED = "false"

# API 访问令牌(可选)
# 配置后，所有 /search、/content 和 /markdown 请求都需要提供此 token 进行鉴权
# 可以通过 Authorization header (Bearer token) 或 query 参数 (?token=xxx) 传递
# 不要把真实 TOKEN 写入 wrangler.toml；使用 wrangler secret put TOKEN。
# TOKEN = ""

# Tavily 搜索 API key（可选，推荐）—— 作为默认链的可靠基座，避免免费爬虫引擎被挑战时无结果
# 不要把真实 key 写入 wrangler.toml；使用 wrangler secret put TAVILY_API_KEY
# TAVILY_API_KEY = ""

# 搜索网关配置(可选)
# DEFAULT_ENGINES = "startpage,duckduckgo,brave,mojeek,bing"
# DEFAULT_TIMEOUT = "4000"
# HEDGED_FALLBACK_DELAY_MS = "400"
# FALLBACK_MIN_RESULTS = "6"
# FALLBACK_MIN_CONTRIBUTING_ENGINES = "2"
# CACHE_TTL_SECONDS = "300"
# STALE_CACHE_TTL_SECONDS = "1800"
# RATE_LIMIT_WINDOW_SECONDS = "60"
# RATE_LIMIT_MAX_REQUESTS = "60"
# HEALTH_FAILURE_THRESHOLD = "2"
# HEALTH_COOLDOWN_SECONDS = "180"
# HEALTH_STATE_TTL_SECONDS = "3600"

# Cloudflare Browser Rendering Markdown API (optional)
# Used by /markdown. Create an API token with Browser Rendering - Edit permission.
# CF_BROWSER_RENDERING_ACCOUNT_ID = "your-account-id"
# CF_BROWSER_RENDERING_API_TOKEN = "your-browser-rendering-api-token"

# ============================================
# KV 缓存绑定
# ============================================
# 搜索响应缓存，重复查询命中缓存、节省 API 额度
[[kv_namespaces]]
binding = "SEARCH_KV"
id = "8589583902404415ad8dfe7bbf01dbd7"

# ============================================
# KV 状态绑定
# ============================================
# 用于跨 isolate 共享限流计数和引擎健康度
[[kv_namespaces]]
binding = "SEARCH_STATE_KV"
id = "abf522c8c80c40a88fc17b77e4d81d8c"

# ============================================
# 环境配置(可选)
# ============================================
# 生产环境配置
# [env.production]
# name = "cloudflare-search-prod"
# workers_dev = false
# routes = [
#   { pattern = "search.yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# 开发环境配置
# [env.staging]
# name = "cloudflare-search-staging"
# workers_dev = true

# ============================================
# 资源限制(可选)
# ============================================
# 限制 CPU 时间(毫秒)
# limits = { cpu_ms = 50 }

# ============================================
# 观察性配置(可选)
# ============================================
# 启用日志推送
# [observability]
# enabled = true
